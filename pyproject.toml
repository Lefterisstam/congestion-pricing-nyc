[project]
name = "congestion-pricing-nyc"
version = "0.1.0"
description = "Did NYC congestion pricing change yellow-taxi traffic? SQL + dbt + DuckDB + Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]